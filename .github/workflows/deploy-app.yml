name: Publicar site e sistema

on:
  push:
    paths: ['app/**', 'site/**', '.github/workflows/deploy-app.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            site/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      # Site público na raiz, sistema interno em /sistema/
      - run: |
          mkdir -p public_html
          cp -r site/dist/. public_html/
          mkdir -p public_html/sistema
          cp -r app/dist/. public_html/sistema/
          rm -f public_html/sistema/404.html public_html/sistema/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
