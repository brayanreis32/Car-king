<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Página não encontrada · Car King</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #F6F6F4; color: #1B1C1E; }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { color: #6A6C70; margin: 0 0 20px; }
    a { display: inline-block; background: #1B1C1E; color: #fff; padding: 10px 16px; border-radius: 8px; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Página não encontrada</h1>
    <p>Esse endereço não existe. Você será levado ao início do Car King.</p>
    <a id="home" href="/">Ir para o início</a>
  </main>
  <script>
    // GitHub Pages de projeto: o app fica em /<repositório>/
    var seg = location.pathname.split('/')[1];
    var home = seg ? '/' + seg + '/' : '/';
    document.getElementById('home').href = home;
    setTimeout(function () { location.replace(home); }, 2500);
  </script>
</body>
</html>
